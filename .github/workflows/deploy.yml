name: Build and Deploy to GHCR

on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: minhtettharutycc/parcel-pilot-backend

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: minhtettharutycc
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                  labels: version=latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy-to-vps:
        needs: build-and-push
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'

        steps:
            - name: Deploy to VPS
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      cd ~/apps/parcel-pilot-backend
                      echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u minhtettharutycc --password-stdin
                      docker pull ghcr.io/minhtettharutycc/parcel-pilot-backend:latest
                      docker-compose down
                      docker-compose up -d
                      sleep 10
                      docker-compose exec -T backend npm run prisma:migrate:deploy || true
                      echo "Deployment completed!"

            - name: Health Check
              run: |
                  sleep 10
                  curl -f http://${{ secrets.VPS_HOST }}:6000/health || exit 1
                  echo "✅ API is healthy!"
